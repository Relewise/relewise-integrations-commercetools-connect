name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test full sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./full-sync
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: full-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify compiled runtime
        env:
          CTP_CLIENT_ID: "123456789012345678901234"
          CTP_CLIENT_SECRET: "12345678901234567890123456789012"
          CTP_PROJECT_KEY: ci-project
          CTP_SCOPE: view_products:ci-project
          CTP_REGION: europe-west1.gcp
          RELEWISE_STORE_KEY: ci-store
          RELEWISE_DATASET_ID: ci-dataset
          RELEWISE_API_KEY: ci-api-key
          RELEWISE_SERVER_URL: https://api.relewise.com
        run: node -e "const { createApp } = require('./build/app'); createApp();"

      - name: Unit tests
        run: npm run test:ci
